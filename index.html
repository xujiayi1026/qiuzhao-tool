<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋招投递工具台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header-info { font-size: 14px; opacity: 0.9; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-card .num { font-size: 36px; font-weight: 700; }
        .stat-card .label { font-size: 13px; color: #666; margin-top: 4px; }
        .stat-card:nth-child(1) .num { color: #1890ff; }
        .stat-card:nth-child(2) .num { color: #faad14; }
        .stat-card:nth-child(3) .num { color: #722ed1; }
        .stat-card:nth-child(4) .num { color: #52c41a; }
        .stat-card:nth-child(5) .num { color: #ff4d4f; }
        .stat-card:nth-child(6) .num { color: #13c2c2; }
        .toolbar { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .btn { padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-danger:hover { background: #e63e40; }
        .search-box { flex: 1; min-width: 200px; padding: 8px 16px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; }
        .search-box:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.2); }
        .filter-btn { padding: 8px 16px; border: 1px solid #d9d9d9; background: white; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { border-color: #667eea; color: #667eea; background: #f0f3ff; }
        .table-wrapper { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 14px 16px; text-align: left; font-weight: 600; font-size: 13px; color: #666; border-bottom: 1px solid #f0f0f0; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #fafafa; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: #e6f7ff; color: #1890ff; }
        .status-writtentest { background: #fffbe6; color: #faad14; }
        .status-interview { background: #f9f0ff; color: #722ed1; }
        .status-offer { background: #f6ffed; color: #52c41a; }
        .status-rejected { background: #fff2f0; color: #ff4d4f; }
        .action-btn { padding: 4px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 6px; transition: all 0.2s; }
        .action-btn.edit { background: #e6f7ff; color: #1890ff; }
        .action-btn.edit:hover { background: #1890ff; color: white; }
        .action-btn.delete { background: #fff2f0; color: #ff4d4f; }
        .action-btn.delete:hover { background: #ff4d4f; color: white; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 16px; padding: 30px; width: 90%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 24px; font-size: 20px; color: #333; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #333; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.2); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { padding: 10px 28px; }
        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .empty { text-align: center; padding: 60px 20px; color: #999; }
        .empty-icon { font-size: 64px; margin-bottom: 16px; }
        @media (max-width: 768px) { .stats { grid-template-columns: repeat(3, 1fr); } .toolbar { flex-direction: column; } }
    </style>
</head>
<body>
<div class="header">
    <div><h1>📚 秋招投递工具台</h1><div class="header-info">管理你的每一份投递，离 Offer 更近一步</div></div>
    <div class="header-info" id="dateInfo"></div>
</div>
<div class="container">
    <div class="stats">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总投递</div></div>
        <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">待处理</div></div>
        <div class="stat-card"><div class="num" id="statWritten">0</div><div class="label">笔试中</div></div>
        <div class="stat-card"><div class="num" id="statInterview">0</div><div class="label">面试中</div></div>
        <div class="stat-card"><div class="num" id="statOffer">0</div><div class="label">已 Offer</div></div>
        <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">已拒绝</div></div>
    </div>
    <div class="toolbar">
        <button class="btn btn-primary" onclick="openModal()">+ 新增投递</button>
        <input type="text" class="search-box" placeholder="搜索公司/岗位..." id="searchInput" oninput="renderTable()">
        <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
        <button class="filter-btn" onclick="setFilter('pending',this)">待处理</button>
        <button class="filter-btn" onclick="setFilter('writtentest',this)">笔试中</button>
        <button class="filter-btn" onclick="setFilter('interview',this)">面试中</button>
        <button class="filter-btn" onclick="setFilter('offer',this)">已Offer</button>
        <button class="filter-btn" onclick="setFilter('rejected',this)">已拒绝</button>
        <button class="btn btn-danger" onclick="clearAll()" style="margin-left:auto;">清空</button>
    </div>
    <div class="table-wrapper">
        <table><thead><tr><th>公司</th><th>岗位</th><th>投递时间</th><th>状态</th><th>备注</th><th>进度</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table>
        <div class="empty" id="emptyState"><div class="empty-icon">📭</div><p>还没有投递记录，点击「新增投递」开始吧！</p></div>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">新增投递</h2>
        <input type="hidden" id="editId">
        <div class="form-group"><label>公司名称 *</label><input type="text" id="companyInput" placeholder="如：Babycare"></div>
        <div class="form-group"><label>岗位名称 *</label><input type="text" id="positionInput" placeholder="如：产品经理"></div>
        <div class="form-group"><label>投递时间</label><input type="date" id="dateInput"></div>
        <div class="form-group"><label>当前状态</label><select id="statusInput"><option value="pending">待处理</option><option value="writtentest">笔试中</option><option value="interview">面试中</option><option value="offer">已 Offer</option><option value="rejected">已拒绝</option></select></div>
        <div class="form-group"><label>备注</label><textarea id="noteInput" placeholder="一面时间、准备重点、面试反馈等"></textarea></div>
        <div class="modal-actions"><button class="btn" onclick="closeModal()" style="background:#f5f5f5;">取消</button><button class="btn btn-primary" onclick="saveItem()">保存</button></div>
    </div>
</div>
<script>
const STATUS_MAP={pending:{text:'待处理',cls:'status-pending',p:20},writtentest:{text:'笔试中',cls:'status-writtentest',p:40},interview:{text:'面试中',cls:'status-interview',p:70},offer:{text:'已 Offer',cls:'status-offer',p:100},rejected:{text:'已拒绝',cls:'status-rejected',p:0}};
let data=JSON.parse(localStorage.getItem('autumnRecruitData')||'[]');
let currentFilter='all';
document.getElementById('dateInfo').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
document.getElementById('dateInput').valueAsDate=new Date();

function renderTable(){
    const kw=document.getElementById('searchInput').value.toLowerCase();
    let f=data.filter(i=>(currentFilter==='all'||i.status===currentFilter)&&(!kw||i.company.toLowerCase().includes(kw)||i.position.toLowerCase().includes(kw)));
    const t=document.getElementById('tableBody'),e=document.getElementById('emptyState');
    if(!f.length){t.innerHTML='';e.style.display='block';}
    else{e.style.display='none';t.innerHTML=f.map(i=>{const s=STATUS_MAP[i.status];return`<tr><td><strong>${i.company}</strong></td><td>${i.position}</td><td>${i.date||'-'}</td><td><span class="status ${s.cls}">${s.text}</span></td><td style="max-width:200px;color:#888;font-size:13px">${i.note||'-'}</td><td style="width:120px"><div class="progress-bar"><div class="progress-fill" style="width:${s.p}%;background:${s.p===100?'#52c41a':s.p===0?'#ff4d4f':'#667eea'}"></div></div></td><td><button class="action-btn edit" onclick="editItem('${i.id}')">编辑</button><button class="action-btn delete" onclick="deleteItem('${i.id}')">删除</button></td></tr>`}).join('');}
    updateStats();
}
function updateStats(){
    document.getElementById('statTotal').textContent=data.length;
    document.getElementById('statPending').textContent=data.filter(i=>i.status==='pending').length;
    document.getElementById('statWritten').textContent=data.filter(i=>i.status==='writtentest').length;
    document.getElementById('statInterview').textContent=data.filter(i=>i.status==='interview').length;
    document.getElementById('statOffer').textContent=data.filter(i=>i.status==='offer').length;
    document.getElementById('statRejected').textContent=data.filter(i=>i.status==='rejected').length;
}
function setFilter(s,el){currentFilter=s;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderTable();}
function openModal(id){document.getElementById('modalOverlay').classList.add('active');if(!id){document.getElementById('modalTitle').textContent='新增投递';document.getElementById('editId').value='';document.getElementById('companyInput').value='';document.getElementById('positionInput').value='';document.getElementById('dateInput').valueAsDate=new Date();document.getElementById('statusInput').value='pending';document.getElementById('noteInput').value='';}}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');}
function saveItem(){const c=document.getElementById('companyInput').value.trim(),p=document.getElementById('positionInput').value.trim();if(!c||!p){alert('请填写公司和岗位！');return;}const item={id:document.getElementById('editId').value||Date.now().toString(),company:c,position:p,date:document.getElementById('dateInput').value,status:document.getElementById('statusInput').value,note:document.getElementById('noteInput').value.trim()};const idx=data.findIndex(i=>i.id===item.id);if(idx>=0)data[idx]=item;else data.push(item);localStorage.setItem('autumnRecruitData',JSON.stringify(data));closeModal();renderTable();}
function editItem(id){const i=data.find(x=>x.id===id);if(!i)return;openModal(id);document.getElementById('modalTitle').textContent='编辑投递';document.getElementById('editId').value=i.id;document.getElementById('companyInput').value=i.company;document.getElementById('positionInput').value=i.position;document.getElementById('dateInput').value=i.date;document.getElementById('statusInput').value=i.status;document.getElementById('noteInput').value=i.note;}
function deleteItem(id){if(!confirm('确认删除此投递记录？'))return;data=data.filter(i=>i.id!==id);localStorage.setItem('autumnRecruitData',JSON.stringify(data));renderTable();}
function clearAll(){if(!confirm('确认清空所有数据？'))return;data=[];localStorage.setItem('autumnRecruitData',JSON.stringify(data));renderTable();}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
renderTable();
</script>
</body>
</html>
