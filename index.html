<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋招投递工具台</title>
    <style>
        :root {
            --red: #C20C0C;
            --red-bright: #E60026;
            --red-light: #FFF1F0;
            --red-hover: #A80A0A;
            --bg: #F5F5F5;
            --card: #FFFFFF;
            --text1: #333333;
            --text2: #666666;
            --text3: #999999;
            --border: #E8E8E8;
            --border-light: #F0F0F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text1); min-height: 100vh; }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #C20C0C 0%, #A80A0A 50%, #8B0909 100%);
            padding: 28px 32px; color: #fff; position: relative; overflow: hidden;
        }
        .header::before {
            content: ''; position: absolute; top: -50%; right: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }
        .header::after {
            content: ''; position: absolute; bottom: -60px; left: 20%; width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,.05) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite reverse;
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
        .header-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
        .header-sub { font-size: 13px; opacity: .7; margin-top: 4px; letter-spacing: 1px; }
        .header-info { font-size: 14px; opacity: .75; }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

        /* ===== Stats ===== */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px 14px; text-align: center; cursor: default;
            transition: all .3s cubic-bezier(.4,0,.2,1); position: relative; overflow: hidden;
        }
        .stat-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px;
            background: var(--red); transform: scaleX(0); transition: transform .3s;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(194,12,12,.1); border-color: rgba(194,12,12,.2); }
        .stat-card:hover::after { transform: scaleX(1); }
        .stat-card .num { font-size: 36px; font-weight: 700; transition: transform .3s; color: var(--text1); }
        .stat-card:hover .num { transform: scale(1.1); }
        .stat-card .label { font-size: 12px; color: var(--text3); margin-top: 4px; letter-spacing: 2px; }
        .stat-card:nth-child(1) .num { color: var(--red); }
        .stat-card:nth-child(2) .num { color: #1890FF; }
        .stat-card:nth-child(3) .num { color: #D48806; }
        .stat-card:nth-child(4) .num { color: #722ED1; }
        .stat-card:nth-child(5) .num { color: #389E0D; }
        .stat-card:nth-child(6) .num { color: #CF1322; }
        .stat-card:nth-child(1)::after { background: var(--red); }
        .stat-card:nth-child(2)::after { background: #1890FF; }
        .stat-card:nth-child(3)::after { background: #D48806; }
        .stat-card:nth-child(4)::after { background: #722ED1; }
        .stat-card:nth-child(5)::after { background: #389E0D; }
        .stat-card:nth-child(6)::after { background: #CF1322; }

        /* ===== Toolbar ===== */
        .toolbar {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 18px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }
        .btn {
            padding: 9px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
            font-weight: 500; transition: all .25s cubic-bezier(.4,0,.2,1); font-family: inherit;
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: rgba(255,255,255,.3); border-radius: 50%; transform: translate(-50%,-50%);
            transition: width .5s, height .5s, opacity .5s; opacity: 0;
        }
        .btn:active::after { width: 200px; height: 200px; opacity: 1; transition: 0s; }
        .btn-primary { background: linear-gradient(135deg, var(--red-bright), var(--red)); color: #fff; box-shadow: 0 2px 8px rgba(194,12,12,.3); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(194,12,12,.4); }
        .btn-primary:active { transform: translateY(0); }
        .btn-danger { background: #fff; color: #F5222D; border: 1px solid #F5222D; }
        .btn-danger:hover { background: #F5222D; color: #fff; }
        .search-box {
            flex: 1; min-width: 180px; padding: 9px 16px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; outline: none; background: var(--card); color: var(--text1);
            transition: all .3s;
        }
        .search-box:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(194,12,12,.1); }
        .search-box::placeholder { color: var(--text3); }
        .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px; border: 1px solid var(--border); background: var(--card); border-radius: 20px;
            cursor: pointer; font-size: 12px; transition: all .25s cubic-bezier(.4,0,.2,1); color: var(--text2);
            font-family: inherit; position: relative;
        }
        .filter-btn:hover { border-color: var(--red); color: var(--red); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(194,12,12,.12); }
        .filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 2px 8px rgba(194,12,12,.3); }
        .action-group { margin-left: auto; display: flex; gap: 8px; align-items: center; }

        /* ===== Table ===== */
        .table-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #FAFAFA; padding: 14px 14px; text-align: left; font-weight: 600; font-size: 12px;
            color: var(--text2); border-bottom: 1px solid var(--border); letter-spacing: 1px;
        }
        td { padding: 14px; border-bottom: 1px solid var(--border-light); font-size: 13px; transition: background .2s; }
        tr:last-child td { border-bottom: none; }
        tbody tr { animation: rowIn .4s cubic-bezier(.4,0,.2,1) both; }
        tbody tr:nth-child(1){animation-delay:.02s} tbody tr:nth-child(2){animation-delay:.06s}
        tbody tr:nth-child(3){animation-delay:.1s} tbody tr:nth-child(4){animation-delay:.14s}
        tbody tr:nth-child(5){animation-delay:.18s} tbody tr:nth-child(6){animation-delay:.22s}
        tbody tr:nth-child(n+7){animation-delay:.25s}
        @keyframes rowIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        tbody tr:hover td { background: var(--red-light); }

        .status { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; transition: transform .2s; }
        .status:hover { transform: scale(1.08); }
        .status-pending { background: #E6F7FF; color: #1890FF; }
        .status-writtentest { background: #FFF7E6; color: #D48806; }
        .status-interview { background: #F9F0FF; color: #722ED1; }
        .status-offer { background: #F6FFED; color: #389E0D; }
        .status-rejected { background: #FFF1F0; color: #CF1322; }

        .cat-tag { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; transition: all .2s; }
        .cat-tag:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.1); }
        .cat-internet { background: #E6F7FF; color: #096DD9; }
        .cat-fmcg { background: #FFF1F0; color: #CF1322; }
        .cat-soe { background: #F6FFED; color: #237804; }
        .cat-bank { background: #FFF7E6; color: #AD6800; }
        .cat-other { background: #F5F5F5; color: #666; }
        .cat-none { background: #FAFAFA; color: #BBB; }

        .action-btn {
            padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px;
            margin-right: 5px; transition: all .25s cubic-bezier(.4,0,.2,1); font-family: inherit;
        }
        .action-btn.edit { background: #E6F7FF; color: #096DD9; }
        .action-btn.edit:hover { background: #096DD9; color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(9,109,217,.3); }
        .action-btn.delete { background: #FFF1F0; color: #CF1322; }
        .action-btn.delete:hover { background: #CF1322; color: #fff; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(207,19,34,.3); }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.45); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal {
            background: var(--card); border-radius: 16px; padding: 30px; width: 92%; max-width: 540px;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,.25);
            transform: scale(.9) translateY(20px); transition: transform .35s cubic-bezier(.34,1.56,.64,1);
        }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal h2 { margin-bottom: 22px; font-size: 20px; color: var(--text1); letter-spacing: 1px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--text1); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; outline: none; font-family: inherit; background: #FAFAFA; color: var(--text1);
            transition: all .3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--red); box-shadow: 0 0 0 3px rgba(194,12,12,.1); background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }
        .modal-actions .btn { padding: 10px 32px; }
        .btn-cancel { background: #F5F5F5; color: var(--text2); }
        .btn-cancel:hover { background: var(--border); }

        /* ===== Progress ===== */
        .progress-bar { width: 100%; height: 6px; background: #F0F0F0; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.4,0,.2,1); position: relative; }
        .progress-fill::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

        .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
        .empty-icon { font-size: 56px; margin-bottom: 14px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

        /* ===== Upload ===== */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center;
            cursor: pointer; transition: all .3s; background: #FAFAFA; position: relative;
        }
        .upload-zone:hover { border-color: var(--red); background: var(--red-light); transform: translateY(-2px); }
        .upload-zone.has-image { padding: 8px; border-style: solid; border-color: var(--red); }
        .upload-zone .upload-tip { color: var(--text3); font-size: 13px; }
        .upload-zone .upload-icon { font-size: 30px; margin-bottom: 6px; transition: transform .3s; }
        .upload-zone:hover .upload-icon { transform: scale(1.15); }
        .upload-zone input[type=file] { display: none; }
        .upload-preview { max-width: 100%; max-height: 200px; border-radius: 6px; display: block; margin: 0 auto; }
        .upload-remove {
            position: absolute; top: 4px; right: 4px; background: #F5222D; color: white; border: none;
            border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; line-height: 1;
            transition: transform .2s;
        }
        .upload-remove:hover { transform: rotate(90deg) scale(1.1); }
        .tag-jd { display: inline-block; width: 6px; height: 6px; background: #722ED1; border-radius: 50%; margin-left: 4px; }
        .tag-img { display: inline-block; width: 6px; height: 6px; background: #13C2C2; border-radius: 50%; margin-left: 4px; }

        /* ===== Nav Tabs ===== */
        .nav-tabs { display: flex; gap: 6px; margin-top: 18px; position: relative; z-index: 1; }
        .nav-tab {
            padding: 9px 22px; border: none; background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
            border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-family: inherit;
            transition: all .25s cubic-bezier(.4,0,.2,1); position: relative; top: 2px;
        }
        .nav-tab:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); }
        .nav-tab.active { background: var(--bg); color: var(--red); font-weight: 600; }

        /* ===== Panel（简历库/简历信息） ===== */
        .panel {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; animation: rowIn .35s cubic-bezier(.4,0,.2,1) both;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
        .panel-header h2 { font-size: 18px; color: var(--text1); letter-spacing: 1px; }
        .panel-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
        .panel-header .btn { flex-shrink: 0; }
        .header-btns { display: flex; gap: 8px; flex-shrink: 0; }

        /* 简历库 */
        .resume-list { display: flex; flex-direction: column; gap: 10px; }
        .resume-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px;
            border: 1px solid var(--border); border-radius: 10px; transition: all .25s;
            animation: rowIn .35s cubic-bezier(.4,0,.2,1) both;
        }
        .resume-item:hover { border-color: rgba(194,12,12,.35); box-shadow: 0 4px 14px rgba(194,12,12,.08); transform: translateY(-2px); }
        .resume-icon {
            width: 44px; height: 52px; background: linear-gradient(135deg, #FFF1F0, #FFD9D6); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .resume-meta { flex: 1; min-width: 0; }
        .resume-name { font-size: 15px; font-weight: 600; color: var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .resume-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }
        .resume-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .storage-tip { margin-top: 14px; font-size: 12px; color: var(--text3); background: #FFFBF0; border: 1px dashed #FFD591; border-radius: 8px; padding: 10px 14px; }

        /* 简历信息板块 */
        .info-section {
            border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px;
            transition: all .25s; animation: rowIn .35s cubic-bezier(.4,0,.2,1) both;
        }
        .info-section:hover { border-color: rgba(194,12,12,.3); box-shadow: 0 4px 14px rgba(194,12,12,.06); }
        .info-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .info-title {
            flex: 1; border: none; background: transparent; font-size: 16px; font-weight: 700;
            color: var(--red); outline: none; padding: 4px 8px; border-radius: 6px;
            border-bottom: 2px solid transparent; transition: all .25s; font-family: inherit;
        }
        .info-title:focus { background: var(--red-light); border-bottom-color: var(--red); }
        .info-title::placeholder { color: var(--text3); font-weight: 400; }
        .info-section textarea {
            width: 100%; min-height: 110px; padding: 12px 14px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; line-height: 1.7; resize: vertical; outline: none;
            background: #FAFAFA; color: var(--text1); font-family: inherit; transition: all .3s;
        }
        .info-section textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(194,12,12,.1); background: #fff; }
        .info-section textarea::placeholder { color: var(--text3); }
        .info-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .info-count { font-size: 11px; color: var(--text3); }

        /* 简历编辑态 */
        .resume-name { transition: color .2s; }
        .resume-note { font-size: 12px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .resume-note.note-empty { color: var(--text3); }
        .resume-item.editing { border-color: var(--red); background: #FFFBFB; }
        .inline-edit {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; outline: none; font-family: inherit; margin-bottom: 6px;
            transition: all .25s; background: #fff; color: var(--text1);
        }
        .inline-edit:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(194,12,12,.1); }
        .inline-edit.note-input { font-size: 12px; }

        /* 简历信息层级树 */
        .info-children {
            margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border-light);
            display: flex; flex-direction: column; gap: 10px;
        }
        .info-children .info-section { margin-bottom: 0; }
        .info-section.d1 > .info-head > .info-title { color: #1890FF; }
        .info-section.d2 > .info-head > .info-title { color: #389E0D; }
        .info-section.d3 > .info-head > .info-title { color: #722ED1; }
        .info-head { flex-wrap: wrap; }
        .info-title { min-width: 140px; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
            background: var(--text1); color: #fff; padding: 10px 28px; border-radius: 8px;
            font-size: 14px; z-index: 9999; transition: transform .4s cubic-bezier(.34,1.56,.64,1);
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #52C41A; }
        .toast.error { background: #F5222D; }

        /* ===== Confirm Dialog ===== */
        .confirm-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.4); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(3px);
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: #fff; border-radius: 14px; padding: 28px; width: 90%; max-width: 360px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2);
            animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
        }
        @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
        .confirm-box .confirm-icon { font-size: 42px; margin-bottom: 12px; }
        .confirm-box p { font-size: 15px; color: var(--text1); margin-bottom: 20px; }
        .confirm-actions { display: flex; gap: 10px; justify-content: center; }
        .confirm-actions .btn { padding: 8px 24px; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .header { padding: 16px 14px; }
            .header-inner { flex-direction: column; gap: 4px; text-align: center; }
            .header h1 { font-size: 20px; letter-spacing: 1px; }
            .header-sub { font-size: 12px; }
            .header-info { font-size: 12px; }
            .container { padding: 14px 10px; }

            .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
            .stat-card { padding: 12px 6px; border-radius: 10px; }
            .stat-card .num { font-size: 22px; }
            .stat-card .label { font-size: 11px; letter-spacing: 1px; margin-top: 2px; }

            .toolbar { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .toolbar .btn-primary { width: 100%; padding: 12px; font-size: 15px; }
            .search-box { width: 100%; min-width: 0; padding: 11px 14px; font-size: 14px; }
            .filter-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
            .filter-row::-webkit-scrollbar { display: none; }
            .filter-btn { flex-shrink: 0; padding: 7px 14px; font-size: 12px; }
            .action-group { margin-left: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .action-group .btn { padding: 10px 4px; font-size: 13px; }

            /* 表格 → 卡片 */
            .table-wrapper { background: transparent; border: none; border-radius: 0; overflow: visible; }
            table, tbody { display: block; width: 100%; }
            thead { display: none; }
            tr {
                display: block; background: var(--card); border: 1px solid var(--border);
                border-radius: 12px; margin-bottom: 12px; overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,.04);
            }
            tbody tr:hover td { background: transparent; }
            td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 9px 14px; border-bottom: 1px solid var(--border-light);
                font-size: 13px; text-align: right; min-height: 38px;
            }
            td::before {
                content: attr(data-label); font-weight: 600; color: var(--text2);
                font-size: 12px; text-align: left; flex-shrink: 0; margin-right: 12px;
            }
            td[data-label="公司"] {
                background: linear-gradient(135deg, #FFF5F5, #FFF1F0);
                font-size: 16px; padding: 13px 14px;
            }
            td[data-label="公司"]::before { display: none; }
            td[data-label="公司"] strong { color: var(--red); font-size: 16px; }
            td[data-label="备注"] { color: var(--text3); font-size: 12px; max-width: none !important; width: auto !important; }
            td[data-label="附件"] { border-bottom: none; }
            td[data-label="操作"] { border-bottom: none; background: #FAFAFA; padding: 10px 14px; }
            td[data-label="操作"]::before { display: none; }
            td[data-label="操作"] { justify-content: flex-end; gap: 8px; }
            td[data-label="进度"] { width: auto !important; }
            .action-btn { padding: 8px 20px; font-size: 13px; border-radius: 8px; }
            td[data-label="进度"] .progress-bar { width: 110px; }

            .empty { padding: 40px 16px; }
            .empty-icon { font-size: 44px; }

            /* 弹窗 */
            .modal { width: 96%; max-width: none; padding: 20px 16px; border-radius: 14px; max-height: 88vh; }
            .modal h2 { font-size: 18px; margin-bottom: 16px; }
            .form-group input, .form-group select, .form-group textarea { padding: 12px 14px; font-size: 15px; }
            .form-row { flex-direction: column; gap: 0; }
            .modal-actions { flex-direction: row; gap: 10px; }
            .modal-actions .btn { flex: 1; padding: 13px; font-size: 15px; }

            .confirm-box { padding: 24px 18px; }
            .confirm-actions .btn { flex: 1; padding: 12px; }
            .toast { padding: 11px 22px; font-size: 14px; width: max-content; max-width: 90vw; }

            /* 标签页 + 新面板 */
            .nav-tabs { margin-top: 14px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
            .nav-tabs::-webkit-scrollbar { display: none; }
            .nav-tab { flex: 1; padding: 10px 8px; font-size: 13px; white-space: nowrap; text-align: center; }
            .panel { padding: 14px 12px; border-radius: 10px; }
            .panel-header { flex-direction: column; gap: 10px; }
            .panel-header .btn { width: 100%; padding: 12px; }
            .header-btns { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .resume-item { flex-wrap: wrap; padding: 12px; gap: 10px; }
            .resume-meta { flex-basis: calc(100% - 58px); }
            .resume-actions { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .resume-actions .action-btn { padding: 9px 4px; font-size: 13px; border-radius: 8px; }
            .info-section { padding: 12px; }
            .info-title { font-size: 15px; min-width: 100px; }
            .info-head .action-btn { padding: 5px 9px; font-size: 11px; }
            .info-section textarea { min-height: 100px; font-size: 15px; }
            .info-children { padding-left: 10px; gap: 8px; }
        }
        @media (max-width: 380px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <div>
            <h1>秋招投递工具台</h1>
            <div class="header-sub">管理你的每一份投递，离 Offer 更近一步</div>
        </div>
        <div class="header-info" id="dateInfo"></div>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" data-view="main" onclick="switchView('main',this)">📊 投递管理</button>
        <button class="nav-tab" data-view="resumes" onclick="switchView('resumes',this)">📄 简历库</button>
        <button class="nav-tab" data-view="resumeinfo" onclick="switchView('resumeinfo',this)">📝 简历信息</button>
    </div>
</div>
<div class="container">
    <div id="viewMain">
    <div class="stats">
        <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总投递</div></div>
        <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">待处理</div></div>
        <div class="stat-card"><div class="num" id="statWritten">0</div><div class="label">笔试中</div></div>
        <div class="stat-card"><div class="num" id="statInterview">0</div><div class="label">面试中</div></div>
        <div class="stat-card"><div class="num" id="statOffer">0</div><div class="label">已 Offer</div></div>
        <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">已拒绝</div></div>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" onclick="openModal()">+ 新增投递</button>
        <input type="text" class="search-box" placeholder="搜索公司 / 岗位 / 类别..." id="searchInput" oninput="renderTable()">
        <div class="filter-row">
            <button class="filter-btn active" data-type="status" data-val="all" onclick="setFilter('status','all',this)">全部状态</button>
            <button class="filter-btn" data-type="status" data-val="pending" onclick="setFilter('status','pending',this)">待处理</button>
            <button class="filter-btn" data-type="status" data-val="writtentest" onclick="setFilter('status','writtentest',this)">笔试</button>
            <button class="filter-btn" data-type="status" data-val="interview" onclick="setFilter('status','interview',this)">面试</button>
            <button class="filter-btn" data-type="status" data-val="offer" onclick="setFilter('status','offer',this)">Offer</button>
            <button class="filter-btn" data-type="status" data-val="rejected" onclick="setFilter('status','rejected',this)">拒绝</button>
        </div>
        <div class="filter-row">
            <button class="filter-btn active" data-type="cat" data-val="all" onclick="setFilter('cat','all',this)">全部类别</button>
            <button class="filter-btn" data-type="cat" data-val="互联网" onclick="setFilter('cat','互联网',this)">互联网</button>
            <button class="filter-btn" data-type="cat" data-val="快消" onclick="setFilter('cat','快消',this)">快消</button>
            <button class="filter-btn" data-type="cat" data-val="央国企" onclick="setFilter('cat','央国企',this)">央国企</button>
            <button class="filter-btn" data-type="cat" data-val="银行" onclick="setFilter('cat','银行',this)">银行</button>
            <button class="filter-btn" data-type="cat" data-val="其他" onclick="setFilter('cat','其他',this)">其他</button>
        </div>
        <div class="action-group">
            <button class="btn btn-danger" onclick="confirmClear()">清空</button>
            <button class="btn btn-cancel" onclick="exportData()" title="导出为JSON文件">导出</button>
            <button class="btn btn-cancel" onclick="document.getElementById('importInput').click()" title="从JSON文件导入">导入</button>
            <button class="btn btn-cancel" onclick="shareApp()" title="复制链接分享给朋友">分享</button>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>公司</th><th>类别</th><th>岗位</th><th>投递时间</th><th>状态</th><th>备注</th><th>附件</th><th>进度</th><th>操作</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="empty" id="emptyState"><div class="empty-icon">📬</div><p>还没有投递记录，点击「新增投递」开始吧</p></div>
    </div>
    </div><!-- /viewMain -->

    <div id="viewResumes" style="display:none">
        <div class="panel">
            <div class="panel-header">
                <div><h2>📄 简历库</h2><p class="panel-sub">上传不同版本的简历 PDF，随时下载投递</p></div>
                <button class="btn btn-primary" onclick="document.getElementById('resumeFileInput').click()">+ 上传简历</button>
            </div>
            <input type="file" id="resumeFileInput" accept=".pdf,application/pdf" style="display:none" onchange="handleResumeUpload(event)">
            <div class="resume-list" id="resumeList"></div>
            <div class="empty" id="resumeEmpty" style="display:none"><div class="empty-icon">📄</div><p>还没有简历，点击「上传简历」添加 PDF</p></div>
            <div class="storage-tip" id="storageTip" style="display:none"></div>
        </div>
    </div>

    <div id="viewResumeInfo" style="display:none">
        <div class="panel">
            <div class="panel-header">
                <div><h2>📝 简历信息</h2><p class="panel-sub">自定义板块，把简历信息都存这里；也可上传 PDF 自动解析填充</p></div>
                <div class="header-btns">
                    <button class="btn btn-cancel" onclick="document.getElementById('pdfParseInput').click()">🔍 解析简历</button>
                    <button class="btn btn-primary" onclick="addInfoSection()">+ 添加板块</button>
                    <input type="file" id="pdfParseInput" accept=".pdf,application/pdf" style="display:none" onchange="parseResumePDF(event)">
                </div>
            </div>
            <div id="infoSections"></div>
            <div class="empty" id="infoEmpty" style="display:none"><div class="empty-icon">✏️</div><p>还没有板块，点击「添加板块」开始整理你的简历信息</p></div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle">新增投递</h2>
        <input type="hidden" id="editId">
        <div class="form-group"><label>公司名称 *</label><input type="text" id="companyInput" placeholder="如：Babycare"></div>
        <div class="form-row">
            <div class="form-group"><label>类别</label>
                <select id="catInput">
                    <option value="">请选择</option>
                    <option value="互联网">互联网</option>
                    <option value="快消">快消</option>
                    <option value="央国企">央国企</option>
                    <option value="银行">银行</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group"><label>岗位名称 *</label><input type="text" id="positionInput" placeholder="如：产品经理"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>投递时间</label><input type="date" id="dateInput"></div>
            <div class="form-group"><label>当前状态</label>
                <select id="statusInput">
                    <option value="pending">待处理</option>
                    <option value="writtentest">笔试中</option>
                    <option value="interview">面试中</option>
                    <option value="offer">已 Offer</option>
                    <option value="rejected">已拒绝</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label>备注</label><textarea id="noteInput" placeholder="一面时间、准备重点、面试反馈等"></textarea></div>
        <div class="form-group"><label>岗位 JD</label><textarea id="jdInput" placeholder="粘贴岗位描述，如：负责XX产品的需求分析、原型设计..." style="min-height:90px"></textarea></div>
        <div class="form-group">
            <label>图片（截图 / 职位描述截图）</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('imageInput').click()">
                <div class="upload-tip" id="uploadTip"><div class="upload-icon">🖼️</div>点击或拖拽上传图片</div>
                <img class="upload-preview" id="imagePreview" style="display:none">
                <button type="button" class="upload-remove" id="uploadRemove" style="display:none" onclick="event.stopPropagation();removeImage()">×</button>
            </div>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImage(event)">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveItem()">保存</button>
        </div>
    </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <div class="confirm-icon">⚠️</div>
        <p id="confirmText">确定要执行此操作吗？</p>
        <div class="confirm-actions">
            <button class="btn btn-cancel" onclick="closeConfirm()">取消</button>
            <button class="btn btn-primary" id="confirmOk" style="background:linear-gradient(135deg,#F5222D,#CF1322);">确定</button>
        </div>
    </div>
</div>

<script>
const STATUS_MAP={pending:{text:'待处理',cls:'status-pending',p:20},writtentest:{text:'笔试中',cls:'status-writtentest',p:40},interview:{text:'面试中',cls:'status-interview',p:70},offer:{text:'已 Offer',cls:'status-offer',p:100},rejected:{text:'已拒绝',cls:'status-rejected',p:0}};
const CAT_MAP={'互联网':'cat-internet','快消':'cat-fmcg','央国企':'cat-soe','银行':'cat-bank','其他':'cat-other'};
const STATUS_COLOR={pending:'#1890FF',writtentest:'#FA8C16',interview:'#722ED1',offer:'#52C41A',rejected:'#F5222D'};
let data=JSON.parse(localStorage.getItem('autumnRecruitData')||'[]');
if(!Array.isArray(data))data=[];
let filterStatus='all', filterCat='all';
document.getElementById('dateInfo').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
document.getElementById('dateInput').valueAsDate=new Date();

// Toast
function toast(msg,type=''){
    const t=document.createElement('div');
    t.className='toast '+type; t.textContent=msg;
    document.body.appendChild(t);
    requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
    setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},2200);
}

// Confirm
let confirmCb=null;
function showConfirm(text,cb){
    document.getElementById('confirmText').textContent=text;
    confirmCb=cb;
    document.getElementById('confirmOverlay').classList.add('active');
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('active');confirmCb=null;}
document.getElementById('confirmOk').addEventListener('click',function(){if(confirmCb)confirmCb();closeConfirm();});

function renderTable(){
    const kw=document.getElementById('searchInput').value.toLowerCase();
    let f=data.filter(i=>{
        if(filterStatus!=='all'&&i.status!==filterStatus)return false;
        if(filterCat!=='all'&&i.cat!==filterCat)return false;
        if(kw){
            const hay=(i.company+' '+i.position+' '+(i.cat||'')+' '+(i.note||'')).toLowerCase();
            if(!hay.includes(kw))return false;
        }
        return true;
    });
    const t=document.getElementById('tableBody'),e=document.getElementById('emptyState');
    if(!f.length){t.innerHTML='';e.style.display='block';}
    else{
        e.style.display='none';
        t.innerHTML=f.map(i=>{
            const s=STATUS_MAP[i.status];
            const catCls=CAT_MAP[i.cat]||'cat-none';
            const catText=i.cat||'未分类';
            const att=(i.jd?'<span class="tag-jd" title="有JD"></span>':'')+(i.image?'<span class="tag-img" title="有图片"></span>':'')||'-';
            const pgc=STATUS_COLOR[i.status]||'#999';
            return`<tr><td data-label="公司"><strong>${i.company}</strong></td><td data-label="类别"><span class="cat-tag ${catCls}">${catText}</span></td><td data-label="岗位">${i.position}</td><td data-label="投递时间" style="white-space:nowrap">${i.date||'-'}</td><td data-label="状态"><span class="status ${s.cls}">${s.text}</span></td><td data-label="备注" style="max-width:160px;color:var(--text3);font-size:12px">${i.note||'-'}</td><td data-label="附件">${att}</td><td data-label="进度" style="width:100px"><div class="progress-bar"><div class="progress-fill" style="width:${s.p}%;background:${pgc}"></div></div></td><td data-label="操作" style="white-space:nowrap"><button class="action-btn edit" onclick="editItem('${i.id}')">编辑</button><button class="action-btn delete" onclick="deleteItem('${i.id}')">删除</button></td></tr>`;
        }).join('');
    }
    updateStats();
}
function updateStats(){
    animateNum('statTotal',data.length);
    animateNum('statPending',data.filter(i=>i.status==='pending').length);
    animateNum('statWritten',data.filter(i=>i.status==='writtentest').length);
    animateNum('statInterview',data.filter(i=>i.status==='interview').length);
    animateNum('statOffer',data.filter(i=>i.status==='offer').length);
    animateNum('statRejected',data.filter(i=>i.status==='rejected').length);
}
function animateNum(id,target){
    const el=document.getElementById(id);
    const cur=parseInt(el.textContent)||0;
    if(cur===target){el.textContent=target;return;}
    const step=cur<target?1:-1;
    let val=cur;
    const timer=setInterval(()=>{val+=step;el.textContent=val;if(val===target)clearInterval(timer);},40);
}
function setFilter(type,val,el){
    if(type==='status')filterStatus=val;else filterCat=val;
    document.querySelectorAll(`.filter-btn[data-type="${type}"]`).forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    renderTable();
}

let currentImage='';
function openModal(id){
    document.getElementById('modalOverlay').classList.add('active');
    if(!id){
        document.getElementById('modalTitle').textContent='新增投递';
        document.getElementById('editId').value='';
        document.getElementById('companyInput').value='';
        document.getElementById('catInput').value='';
        document.getElementById('positionInput').value='';
        document.getElementById('dateInput').valueAsDate=new Date();
        document.getElementById('statusInput').value='pending';
        document.getElementById('noteInput').value='';
        document.getElementById('jdInput').value='';
        clearImage();
    }
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');}

function handleImage(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){currentImage=ev.target.result;showImagePreview(currentImage);};
    reader.readAsDataURL(file);
}
function showImagePreview(src){
    document.getElementById('uploadZone').classList.add('has-image');
    document.getElementById('uploadTip').style.display='none';
    document.getElementById('imagePreview').src=src;
    document.getElementById('imagePreview').style.display='block';
    document.getElementById('uploadRemove').style.display='block';
}
function clearImage(){
    currentImage='';
    document.getElementById('imageInput').value='';
    document.getElementById('uploadZone').classList.remove('has-image');
    document.getElementById('imagePreview').src='';
    document.getElementById('imagePreview').style.display='none';
    document.getElementById('uploadTip').style.display='block';
    document.getElementById('uploadRemove').style.display='none';
}
function removeImage(e){if(e)e.stopPropagation();clearImage();}

const uploadZone=document.getElementById('uploadZone');
uploadZone.addEventListener('dragover',function(e){e.preventDefault();this.style.borderColor='var(--red)';this.style.background='var(--red-light)';});
uploadZone.addEventListener('dragleave',function(){this.style.borderColor='';this.style.background='';});
uploadZone.addEventListener('drop',function(e){
    e.preventDefault();this.style.borderColor='';this.style.background='';
    const file=e.dataTransfer.files[0];
    if(file&&file.type.startsWith('image/')){
        const input=document.getElementById('imageInput');
        const dt=new DataTransfer();dt.items.add(file);input.files=dt.files;
        handleImage({target:{files:[file]}});
    }
});

function saveItem(){
    const c=document.getElementById('companyInput').value.trim();
    const p=document.getElementById('positionInput').value.trim();
    if(!c||!p){toast('请填写公司和岗位！','error');return;}
    const item={
        id:document.getElementById('editId').value||Date.now().toString(),
        company:c, cat:document.getElementById('catInput').value, position:p,
        date:document.getElementById('dateInput').value,
        status:document.getElementById('statusInput').value,
        note:document.getElementById('noteInput').value.trim(),
        jd:document.getElementById('jdInput').value.trim(),
        image:currentImage
    };
    const idx=data.findIndex(i=>i.id===item.id);
    if(idx>=0){data[idx]=item;toast('已更新','success');}else{data.push(item);toast('已保存','success');}
    localStorage.setItem('autumnRecruitData',JSON.stringify(data));
    closeModal();renderTable();
}
function editItem(id){
    const i=data.find(x=>x.id===id);if(!i)return;
    openModal(id);
    document.getElementById('modalTitle').textContent='编辑投递';
    document.getElementById('editId').value=i.id;
    document.getElementById('companyInput').value=i.company;
    document.getElementById('catInput').value=i.cat||'';
    document.getElementById('positionInput').value=i.position;
    document.getElementById('dateInput').value=i.date;
    document.getElementById('statusInput').value=i.status;
    document.getElementById('noteInput').value=i.note;
    document.getElementById('jdInput').value=i.jd||'';
    if(i.image){currentImage=i.image;showImagePreview(i.image);}else{clearImage();}
}
function deleteItem(id){
    showConfirm('确认删除此投递记录？',()=>{
        data=data.filter(i=>i.id!==id);
        localStorage.setItem('autumnRecruitData',JSON.stringify(data));
        renderTable();toast('已删除','success');
    });
}
function confirmClear(){
    showConfirm('确认清空所有数据？此操作不可恢复！',()=>{
        data=[];localStorage.setItem('autumnRecruitData',JSON.stringify(data));
        renderTable();toast('已清空','success');
    });
}
function shareApp(){
    const url=location.href;
    if(navigator.share){
        navigator.share({title:'秋招投递工具台',text:'我一直在用这个管理秋招投递，你也可以试试',url}).catch(()=>{});
    }else if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=>toast('链接已复制，发给朋友即可（对方看到的是自己的数据）','success')).catch(()=>prompt('复制这个链接分享：',url));
    }else{prompt('复制这个链接分享：',url);}
}
function exportData(){
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='秋招投递备份_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出 '+data.length+' 条记录','success');
}
function importData(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        try{
            const arr=JSON.parse(ev.target.result);
            if(!Array.isArray(arr)||!arr.length||!arr[0].company){toast('文件格式不正确','error');return;}
            showConfirm('导入 '+arr.length+' 条记录，覆盖当前数据？',()=>{
                data=arr;
                localStorage.setItem('autumnRecruitData',JSON.stringify(data));
                renderTable();toast('导入成功','success');
            });
        }catch(err){toast('文件解析失败','error');}
    };
    reader.readAsText(file);
    e.target.value='';
}
// ===== 视图切换 =====
function switchView(view,el){
    document.getElementById('viewMain').style.display=view==='main'?'':'none';
    document.getElementById('viewResumes').style.display=view==='resumes'?'':'none';
    document.getElementById('viewResumeInfo').style.display=view==='resumeinfo'?'':'none';
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    if(el)el.classList.add('active');
    if(view==='resumes')renderResumes();
    if(view==='resumeinfo')renderInfoSections();
}

// ===== 简历库 =====
let resumes=JSON.parse(localStorage.getItem('autumnRecruitResumes')||'[]');
if(!Array.isArray(resumes))resumes=[];
resumes.forEach(r=>{if(r.note===undefined)r.note='';});
let editingResumeId=null;
function saveResumes(){
    try{localStorage.setItem('autumnRecruitResumes',JSON.stringify(resumes));}
    catch(e){toast('存储空间不足！请删除部分简历或图片后再上传','error');return false;}
    return true;
}
function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';}
function renderResumes(){
    const list=document.getElementById('resumeList'),empty=document.getElementById('resumeEmpty');
    const tip=document.getElementById('storageTip');
    if(!resumes.length){list.innerHTML='';empty.style.display='block';tip.style.display='none';return;}
    empty.style.display='none';
    list.innerHTML=resumes.map((r,i)=>{
        const editing=editingResumeId===r.id;
        if(editing){
            return `<div class="resume-item editing" style="animation-delay:${i*.04}s">
                <div class="resume-icon">✏️</div>
                <div class="resume-meta">
                    <input class="inline-edit" id="editResumeName" value="${esc(r.name)}" placeholder="简历名称（如：互联网版-产品经理）">
                    <input class="inline-edit note-input" id="editResumeNote" value="${esc(r.note||'')}" placeholder="备注（如：投字节用这版 / 2026秋招通用）">
                    <div class="resume-sub">${r.date} 上传 · ${fmtSize(r.size)}</div>
                </div>
                <div class="resume-actions">
                    <button class="action-btn edit" onclick="saveResumeEdit('${r.id}')">保存</button>
                    <button class="action-btn" style="background:#F5F5F5;color:#666" onclick="cancelResumeEdit()">取消</button>
                </div>
            </div>`;
        }
        return `<div class="resume-item" style="animation-delay:${i*.04}s">
            <div class="resume-icon">📄</div>
            <div class="resume-meta">
                <div class="resume-name">${esc(r.name)}</div>
                <div class="resume-note ${r.note?'':'note-empty'}">${r.note?'📌 '+esc(r.note):'未添加备注'}</div>
                <div class="resume-sub">${r.date} 上传 · ${fmtSize(r.size)}</div>
            </div>
            <div class="resume-actions">
                <button class="action-btn edit" onclick="editResume('${r.id}')">编辑</button>
                <button class="action-btn edit" onclick="previewResume('${r.id}')">预览</button>
                <button class="action-btn edit" style="background:#F6FFED;color:#389E0D" onclick="downloadResume('${r.id}')">下载</button>
                <button class="action-btn delete" onclick="deleteResume('${r.id}')">删除</button>
            </div>
        </div>`;
    }).join('');
    const total=resumes.reduce((s,r)=>s+r.size,0);
    tip.style.display='block';
    tip.textContent=`已用存储 ${fmtSize(total)}（浏览器上限约 5-10MB）。PDF 单份建议 1MB 以内；空间不足时可删除旧简历或投递记录里的图片。`;
}
function editResume(id){
    editingResumeId=id;
    renderResumes();
    setTimeout(()=>{const n=document.getElementById('editResumeName');if(n){n.focus();n.select();}},50);
}
function cancelResumeEdit(){editingResumeId=null;renderResumes();}
function saveResumeEdit(id){
    const r=resumes.find(x=>x.id===id);if(!r)return;
    const n=document.getElementById('editResumeName').value.trim();
    const t=document.getElementById('editResumeNote').value.trim();
    if(!n){toast('简历名称不能为空','error');return;}
    r.name=n;r.note=t;
    if(!saveResumes())return;
    editingResumeId=null;renderResumes();toast('已保存','success');
}
function handleResumeUpload(e){
    const file=e.target.files[0];e.target.value='';
    if(!file)return;
    if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){toast('只支持 PDF 格式','error');return;}
    if(file.size>2*1024*1024){toast('文件超过 2MB，可能导致存储空间不足','error');return;}
    const name=file.name.replace(/\.pdf$/i,'');
    showConfirm(`上传《${name}》？`,()=>{
        const reader=new FileReader();
        reader.onload=function(ev){
            resumes.unshift({id:Date.now().toString(),name,date:new Date().toISOString().slice(0,10),size:file.size,note:'',data:ev.target.result});
            if(saveResumes()){
                editingResumeId=resumes[0].id;
                renderResumes();
                toast('已上传，可修改名称和添加备注','success');
            }
            else{resumes.shift();}
        };
        reader.readAsDataURL(file);
    });
}
function previewResume(id){
    const r=resumes.find(x=>x.id===id);if(!r)return;
    fetch(r.data).then(b=>b.blob()).then(blob=>{
        const url=URL.createObjectURL(blob);
        window.open(url,'_blank');
        setTimeout(()=>URL.revokeObjectURL(url),60000);
    }).catch(()=>window.open(r.data,'_blank'));
}
function downloadResume(id){
    const r=resumes.find(x=>x.id===id);if(!r)return;
    const a=document.createElement('a');
    a.href=r.data;a.download=r.name+'.pdf';a.click();
    toast('已开始下载','success');
}
function deleteResume(id){
    const r=resumes.find(x=>x.id===id);if(!r)return;
    showConfirm(`删除简历《${r.name}》？`,()=>{
        resumes=resumes.filter(x=>x.id!==id);
        if(editingResumeId===id)editingResumeId=null;
        saveResumes();renderResumes();toast('已删除','success');
    });
}

// ===== 简历信息（层级板块） =====
function nid(){return Date.now().toString()+Math.random().toString(36).slice(2,7);}
function migrateNode(s){
    return{id:s.id||nid(),title:s.title||'',content:s.content||'',children:Array.isArray(s.children)?s.children.map(migrateNode):[]};
}
let resumeInfo=JSON.parse(localStorage.getItem('autumnRecruitResumeInfo')||'[]');
if(!Array.isArray(resumeInfo))resumeInfo=[];
resumeInfo=resumeInfo.map(migrateNode);
function saveInfo(){
    try{localStorage.setItem('autumnRecruitResumeInfo',JSON.stringify(resumeInfo));return true;}
    catch(e){toast('存储空间不足','error');return false;}
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function findNode(id,list){
    list=list||resumeInfo;
    for(const n of list){
        if(n.id===id)return n;
        const f=findNode(id,n.children||[]);
        if(f)return f;
    }
    return null;
}
function findInList(id,list){
    list=list||resumeInfo;
    for(let i=0;i<list.length;i++){
        if(list[i].id===id)return{node:list[i],list:list,index:i};
        const r=findInList(id,list[i].children||[]);
        if(r)return r;
    }
    return null;
}
function renderInfoSections(){
    const box=document.getElementById('infoSections'),empty=document.getElementById('infoEmpty');
    if(!resumeInfo.length){box.innerHTML='';empty.style.display='block';return;}
    empty.style.display='none';
    box.innerHTML=renderNodes(resumeInfo,0);
}
function renderNodes(nodes,depth){
    return nodes.map((n,i)=>{
        const d=Math.min(depth,3);
        const kids=n.children&&n.children.length;
        return `<div class="info-section d${d}" data-nid="${n.id}" style="animation-delay:${Math.min(i*.04,.2)}s">
            <div class="info-head">
                <input class="info-title" value="${esc(n.title)}" placeholder="${depth===0?'板块名称（如：项目经历）':'名称（如：项目名称 / 获得奖项）'}"
                    oninput="updateNodeTitle('${n.id}',this.value)">
                <button class="action-btn edit" onclick="addChildNode('${n.id}')" title="在此板块下添加子板块">＋子板块</button>
                <button class="action-btn delete" onclick="deleteNode('${n.id}')">删除</button>
            </div>
            <textarea placeholder="${kids?'（可选）给这一层写点总结...':'在这里输入内容，修改后自动保存...'}"
                oninput="updateNodeContent('${n.id}',this)">${esc(n.content)}</textarea>
            <div class="info-foot"><span class="info-count">${(n.content||'').length} 字</span></div>
            ${kids?`<div class="info-children">${renderNodes(n.children,depth+1)}</div>`:''}
        </div>`;
    }).join('');
}
let lastAddedId=null;
function addInfoSection(){
    const node={id:nid(),title:'',content:'',children:[]};
    resumeInfo.push(node);
    if(!saveInfo())return;
    lastAddedId=node.id;
    renderInfoSections();
    focusNodeTitle();
    toast('板块已添加，给它起个名字吧','success');
}
function addChildNode(id){
    const parent=findNode(id,resumeInfo);if(!parent)return;
    if(!parent.children)parent.children=[];
    const node={id:nid(),title:'',content:'',children:[]};
    parent.children.push(node);
    if(!saveInfo())return;
    lastAddedId=node.id;
    renderInfoSections();
    focusNodeTitle();
    toast('子板块已添加','success');
}
function focusNodeTitle(){
    const el=lastAddedId&&document.querySelector(`[data-nid="${lastAddedId}"] .info-title`);
    if(el){el.focus();}
    lastAddedId=null;
}
function deleteNode(id){
    const n=findNode(id,resumeInfo);if(!n)return;
    const hasKids=n.children&&n.children.length;
    showConfirm(`删除「${n.title||'未命名'}」${hasKids?'及其所有子板块':''}？`,()=>{
        const f=findInList(id,resumeInfo);
        if(f){f.list.splice(f.index,1);saveInfo();renderInfoSections();toast('已删除','success');}
    });
}
let infoTimer=null;
function updateNodeTitle(id,v){
    const n=findNode(id,resumeInfo);if(!n)return;
    n.title=v;
    clearTimeout(infoTimer);
    infoTimer=setTimeout(saveInfo,400);
}
function updateNodeContent(id,el){
    const n=findNode(id,resumeInfo);if(!n)return;
    n.content=el.value;
    const sec=el.closest('.info-section');
    if(sec){const c=sec.querySelector('.info-foot .info-count');if(c)c.textContent=el.value.length+' 字';}
    clearTimeout(infoTimer);
    infoTimer=setTimeout(saveInfo,400);
}

// ===== 简历 PDF 解析 =====
const RESUME_HEADING_KEYWORDS=['个人信息','基本资料','教育背景','教育经历','学习经历','校园经历','学生工作','社会实践','工作经验','工作经历','实习经历','实习经验','项目经历','项目经验','科研经历','论文专利','竞赛经历','志愿经历','专业技能','技能特长','技能清单','语言能力','自我评价','自我介绍','获奖情况','荣誉证书','所获荣誉','荣誉奖项','证书资质','职业证书','兴趣爱好'];
let _pdfjsLoad=null;
function loadPdfJs(){
    if(window.pdfjsLib)return Promise.resolve();
    if(_pdfjsLoad)return _pdfjsLoad;
    const ver='3.11.174';
    const bases=[
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@'+ver+'/build/',
        'https://unpkg.com/pdfjs-dist@'+ver+'/build/'
    ];
    _pdfjsLoad=new Promise((resolve,reject)=>{
        let i=0;
        const tryNext=()=>{
            if(i>=bases.length){_pdfjsLoad=null;reject(new Error('解析组件加载失败，请检查网络'));return;}
            const base=bases[i++];
            const s=document.createElement('script');
            s.src=base+'pdf.min.js';
            s.onload=function(){
                if(window.pdfjsLib){
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
                    resolve();
                }else{tryNext();}
            };
            s.onerror=tryNext;
            document.head.appendChild(s);
        };
        tryNext();
    });
    return _pdfjsLoad;
}
function normalizeTitle(s){
    return String(s||'')
        .replace(/^[0-9①②③④⑤⑥⑦⑧⑨⑩一二三四五六七八九十]+[、.．)）]?\s*/,'')
        .replace(/[\s:：.。、·•\-—_()（）\[\]【】]/g,'')
        .toLowerCase();
}
function pdfPageToText(tc){
    const lines={};
    tc.items.forEach(function(it){
        if(!it.str)return;
        const y=Math.round(it.transform[5]);
        if(!lines[y])lines[y]=[];
        lines[y].push(it);
    });
    return Object.keys(lines).map(Number).sort(function(a,b){return b-a;})
        .map(function(y){
            return lines[y].sort(function(a,b){return a.transform[4]-b.transform[4];})
                .map(function(i){return i.str;}).join('').trim();
        })
        .filter(function(l){return l;})
        .join('\n');
}
function segmentResumeText(text){
    const lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length;});
    const userNorms=resumeInfo.map(function(s){return normalizeTitle(s.title);}).filter(function(n){return n.length>=2;});
    const heads=[];
    lines.forEach(function(l,i){
        if(l.length>16)return;
        const n=normalizeTitle(l);
        if(!n||n.length<2)return;
        let title=null;
        if(userNorms.indexOf(n)>=0){title=l.replace(/[:：\s]+$/,'');}
        else{
            const hit=RESUME_HEADING_KEYWORDS.find(function(h){return normalizeTitle(h)===n;});
            if(hit)title=hit;
        }
        if(title)heads.push({i:i,title:title});
    });
    if(!heads.length)return [];
    const segs=[];
    heads.forEach(function(h,k){
        const end=k<heads.length-1?heads[k+1].i:lines.length;
        const content=lines.slice(h.i+1,end).join('\n').trim();
        if(content)segs.push({title:h.title,content:content});
    });
    const map={};
    segs.forEach(function(s){map[s.title]=map[s.title]?map[s.title]+'\n'+s.content:s.content;});
    return Object.keys(map).map(function(t){return{title:t,content:map[t]};});
}
function parseResumePDF(e){
    const file=e.target.files[0];e.target.value='';
    if(!file)return;
    if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){toast('只支持 PDF 文件','error');return;}
    showConfirm('解析将用 PDF 文字填充同名板块（覆盖现有内容），未匹配的标题会自动新建板块。继续？',async function(){
        toast('正在解析 PDF，请稍候...');
        try{
            await loadPdfJs();
            const buf=await file.arrayBuffer();
            const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
            let text='';
            for(let p=1;p<=pdf.numPages;p++){
                const page=await pdf.getPage(p);
                const tc=await page.getTextContent();
                text+=pdfPageToText(tc)+'\n';
            }
            if(!text.trim()){toast('未提取到文字，可能是扫描件 PDF','error');return;}
            const segs=segmentResumeText(text);
            if(!segs.length){toast('未识别出板块标题（如：教育背景），可手动添加','error');return;}
            let filled=0,created=0;
            segs.forEach(function(s){
                const hit=resumeInfo.find(function(x){return normalizeTitle(x.title)===normalizeTitle(s.title);});
                if(hit){hit.content=s.content;filled++;}
                else{resumeInfo.push({id:nid(),title:s.title,content:s.content,children:[]});created++;}
            });
            if(!saveInfo())return;
            renderInfoSections();
            toast('解析完成：填充 '+filled+' 个板块，新建 '+created+' 个','success');
        }catch(err){
            console.error(err);
            toast('解析失败：'+(err&&err.message||'未知错误'),'error');
        }
    });
}
